</defs><rect width="700" height="348" rx="14" fill="#ffffff"/><line x1="30" y1="34" x2="190" y2="34" stroke="#475569" stroke-width="1.5" marker-end="url(#triangle)"/><text x="220" y="39" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">Vererbung (Generalisierung)</text><text x="470" y="39" font-size="13" text-anchor="start" font-weight="400" fill="#64748b" font-family="'JetBrains Mono', ui-monospace, monospace">Dog → Animal</text><line x1="30" y1="78" x2="190" y2="78" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#triangle)"/><text x="220" y="83" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">Realisierung (Interface)</text><text x="470" y="83" font-size="13" text-anchor="start" font-weight="400" fill="#64748b" font-family="'JetBrains Mono', ui-monospace, monospace">Dog ⇢ IFeedable</text><line x1="30" y1="122" x2="190" y2="122" stroke="#475569" stroke-width="1.5"/><text x="220" y="127" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">Assoziation</text><text x="470" y="127" font-size="13" text-anchor="start" font-weight="400" fill="#64748b" font-family="'JetBrains Mono', ui-monospace, monospace">Teacher — SchoolClass</text><line x1="30" y1="166" x2="190" y2="166" stroke="#475569" stroke-width="1.5" marker-end="url(#open)"/><text x="220" y="171" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">gerichtete Assoziation</text><text x="470" y="171" font-size="13" text-anchor="start" font-weight="400" fill="#64748b" font-family="'JetBrains Mono', ui-monospace, monospace">Order → Customer</text><line x1="30" y1="210" x2="190" y2="210" stroke="#475569" stroke-width="1.5" marker-start="url(#diamond)"/><text x="220" y="215" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">Aggregation („hat ein“)</text><text x="470" y="215" font-size="13" text-anchor="start" font-weight="400" fill="#64748b" font-family="'JetBrains Mono', ui-monospace, monospace">SchoolClass ◇— Student</text><line x1="30" y1="254" x2="190" y2="254" stroke="#475569" stroke-width="1.5" marker-start="url(#diamondfilled)"/><text x="220" y="259" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">Komposition („besteht aus“)</text><text x="470" y="259" font-size="13" text-anchor="start" font-weight="400" fill="#64748b" font-family="'JetBrains Mono', ui-monospace, monospace">House ◆— Room</text><line x1="30" y1="298" x2="190" y2="298" stroke="#475569" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="220" y="303" font-size="14" text-anchor="start" font-weight="600" fill="#1f2937">Abhängigkeit</text><text x="470" y="303" font-size="13" text-anchor="start" font-weight="400" fill="#64748b" font-family="'JetBrains Mono', ui-monospace, monospace">Printer ⇢ Document</text></svg>