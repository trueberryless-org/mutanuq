<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 348" width="700" height="348" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Beziehungen im UML-Klassendiagramm"><title>Beziehungen im UML-Klassendiagramm</title><defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
<marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L11,6 L0,12" fill="none" stroke="#475569" stroke-width="1.5"/></marker>
<marker id="triangle" viewBox="0 0 14 14" refX="13" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M1,1 L13,7 L1,13 z" fill="#ffffff" stroke="#475569" stroke-width="1.5"/></marker>
<marker id="diamond" viewBox="0 0 20 12" refX="19" refY="6" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="13" orient="auto-start-reverse"><path d="M1,6 L10,1 L19,6 L10,11 z" fill="#ffffff" stroke="#475569" stroke-width="1.5"/></marker>
