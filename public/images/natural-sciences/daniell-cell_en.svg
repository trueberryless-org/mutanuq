<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="Inter, Segoe UI, Arial, sans-serif">
  <rect x="1" y="1" width="638" height="418" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="320" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#111827">Daniell cell</text>
  <defs><marker id="e" markerWidth="6" markerHeight="6" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker></defs>
  <!-- wire and voltmeter -->
  <polyline points="160,170 160,80 290,80" fill="none" stroke="#374151" stroke-width="2"/>
  <polyline points="350,80 480,80 480,170" fill="none" stroke="#374151" stroke-width="2"/>
  <circle cx="320" cy="80" r="30" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="320" y="86" text-anchor="middle" font-size="15" font-weight="600" fill="#92400e">1.10 V</text>
  <line x1="190" y1="64" x2="270" y2="64" stroke="#2563eb" stroke-width="2.5" marker-end="url(#e)"/>
  <line x1="370" y1="64" x2="450" y2="64" stroke="#2563eb" stroke-width="2.5" marker-end="url(#e)"/>
  <text x="230" y="52" text-anchor="middle" font-size="13" fill="#2563eb">Electrons e⁻</text>
  <text x="410" y="52" text-anchor="middle" font-size="13" fill="#2563eb">Electrons e⁻</text>
  <!-- beakers -->
  <path d="M90,190 L90,350 Q90,365 105,365 L215,365 Q230,365 230,350 L230,190" fill="none" stroke="#374151" stroke-width="2"/>
  <rect x="92" y="230" width="136" height="133" fill="#e5e7eb" opacity="0.7"/>
  <path d="M410,190 L410,350 Q410,365 425,365 L535,365 Q550,365 550,350 L550,190" fill="none" stroke="#374151" stroke-width="2"/>
  <rect x="412" y="230" width="136" height="133" fill="#dbeafe" opacity="0.9"/>
  <!-- electrodes -->
  <rect x="148" y="170" width="24" height="160" fill="#9ca3af" stroke="#4b5563"/>
  <rect x="468" y="170" width="24" height="160" fill="#d97706" stroke="#92400e"/>
  <!-- salt bridge -->
  <path d="M200,300 L200,150 L440,150 L440,300" fill="none" stroke="#16a34a" stroke-width="16" stroke-linejoin="round" opacity="0.35"/>
  <text x="320" y="128" text-anchor="middle" font-size="13" fill="#166534">Salt bridge</text>
  <!-- labels -->
  <text x="160" y="388" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Anode (−): zinc</text>
  <text x="480" y="388" text-anchor="middle" font-size="14" font-weight="600" fill="#111827">Cathode (+): copper</text>
  <text x="160" y="406" text-anchor="middle" font-size="12" fill="#4b5563">Oxidation: Zn → Zn²⁺ + 2 e⁻</text>
  <text x="480" y="406" text-anchor="middle" font-size="12" fill="#4b5563">Reduction: Cu²⁺ + 2 e⁻ → Cu</text>
  <text x="160" y="352" text-anchor="middle" font-size="12" fill="#4b5563">ZnSO₄ solution</text>
  <text x="480" y="352" text-anchor="middle" font-size="12" fill="#4b5563">CuSO₄ solution</text>
</svg>
