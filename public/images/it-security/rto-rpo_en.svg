<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="1" y="1" width="718" height="228" rx="16" fill="#ffffff" stroke="#e5e7eb"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <!-- time axis -->
  <line x1="40" y1="130" x2="680" y2="130" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="680" y="155" font-size="14" fill="#374151" text-anchor="end">time</text>
  <!-- RPO area -->
  <rect x="140" y="100" width="200" height="60" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="240" y="126" font-size="16" font-weight="700" fill="#92400e" text-anchor="middle">RPO</text>
  <text x="240" y="147" font-size="13" fill="#92400e" text-anchor="middle">lost data</text>
  <!-- RTO area -->
  <rect x="340" y="100" width="260" height="60" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="470" y="126" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">RTO</text>
  <text x="470" y="147" font-size="13" fill="#1e3a8a" text-anchor="middle">downtime</text>
  <!-- markers -->
  <line x1="140" y1="60" x2="140" y2="175" stroke="#16a34a" stroke-width="3"/>
  <text x="140" y="50" font-size="14" fill="#166534" text-anchor="middle">last backup</text>
  <line x1="340" y1="60" x2="340" y2="175" stroke="#dc2626" stroke-width="3"/>
  <text x="340" y="50" font-size="14" fill="#991b1b" text-anchor="middle">incident</text>
  <line x1="600" y1="60" x2="600" y2="175" stroke="#16a34a" stroke-width="3"/>
  <text x="600" y="50" font-size="14" fill="#166534" text-anchor="middle">back in operation</text>
  <text x="240" y="200" font-size="13" fill="#4b5563" text-anchor="middle">How much data loss is acceptable?</text>
  <text x="470" y="200" font-size="13" fill="#4b5563" text-anchor="middle">How long may the outage last?</text>
</svg>
