<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="DHCP-Ablauf (DORA)"><title>DHCP-Ablauf (DORA)</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="700" height="400" rx="14" fill="#ffffff"/><rect x="60" y="30" width="160" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="140" y="61" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">Client</text><rect x="480" y="30" width="160" height="50" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/><text x="560" y="61" font-size="14" text-anchor="middle" font-weight="700" fill="#1f2937">DHCP-Server</text><line x1="140" y1="80" x2="140" y2="380" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="560" y1="80" x2="560" y2="380" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="144" y1="130" x2="554" y2="130" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><text x="350" y="120" font-size="14" text-anchor="middle" font-weight="700" fill="#2563eb">D  DHCPDISCOVER</text><text x="350" y="150" font-size="12" text-anchor="middle" font-weight="400" fill="#64748b">Broadcast: Gibt es einen DHCP-Server?</text><line x1="556" y1="198" x2="146" y2="198" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/><text x="350" y="188" font-size="14" text-anchor="middle" font-weight="700" fill="#059669">O  DHCPOFFER</text><text x="350" y="218" font-size="12" text-anchor="middle" font-weight="400" fill="#64748b">Angebot: 192.168.10.50, Lease 8 h</text><line x1="144" y1="266" x2="554" y2="266" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/><text x="350" y="256" font-size="14" text-anchor="middle" font-weight="700" fill="#2563eb">R  DHCPREQUEST</text><text x="350" y="286" font-size="12" text-anchor="middle" font-weight="400" fill="#64748b">Broadcast: Ich nehme das Angebot</text><line x1="556" y1="334" x2="146" y2="334" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/><text x="350" y="324" font-size="14" text-anchor="middle" font-weight="700" fill="#059669">A  DHCPACK</text><text x="350" y="354" font-size="12" text-anchor="middle" font-weight="400" fill="#64748b">Bestätigung mit Optionen (Gateway, DNS)</text></svg>
